name: Release

# Publish a HACS-ready GitHub Release.
#
# What HACS needs:
# - A published GitHub Release (tags alone are not enough)
# - The release tag becomes the version HACS shows
# - With zip_release in hacs.json, HACS installs the attached zip asset
#
# Ways to cut a release:
# 1. Actions → Release → Run workflow → enter version `1.0.0`
# 2. Create a GitHub Release in the UI / `gh release create v1.0.0`
#    (this workflow then attaches the zip)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (with or without leading v), e.g. 1.0.0"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  COMPONENT_DIR: custom_components/homekit_room_sync
  ZIP_NAME: homekit_room_sync.zip

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
            version="${raw#v}"
            tag="v${version}"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            tag="$RELEASE_TAG"
            version="${tag#v}"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$version" ]; then
            echo "Empty version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$version tag=$tag"

      - name: Create GitHub Release
        if: steps.ver.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

      - name: Stamp manifest version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["COMPONENT_DIR"]) / "manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"manifest version -> {manifest['version']}")
          PY

      - name: Build release zip
        run: |
          set -euo pipefail
          # HACS expects the zip root to contain manifest.json (domain folder contents).
          (cd "$COMPONENT_DIR" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x '*__pycache__*' '*.pyc' '*.pyo')
          unzip -l "$ZIP_NAME" | head -40

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ZIP_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded $ZIP_NAME to $TAG"
