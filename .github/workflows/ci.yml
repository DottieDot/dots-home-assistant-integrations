name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Validate integration manifests
        run: python3 scripts/validate_manifests.py

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # These three checks read GitHub repository settings / default-branch
          # license detection — not files on this PR branch. They fail until the
          # repo About box has a description + topics, and LICENSE is on main
          # (so GitHub reports an SPDX license). Set those in GitHub Settings →
          # General, then remove this ignore list.
          ignore: description topics license
