name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Validate HACS/integration manifests locally
        run: python3 scripts/validate_manifests.py

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Private repositories cannot be fetched via unauthenticated
          # raw.githubusercontent.com (used by hacsjson + integration_manifest).
          # Description/topics/license require GitHub repo admin settings that
          # this workflow token cannot change. Brands is validated from the
          # git tree once brand/icon.png is present.
          ignore: description topics license hacsjson integration_manifest
